<title>Kata Hati</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: logo bulat d'slurp di pojok kiri atas, lalu satu kolom sempit dengan tiga tahap. Nama dulu, pilihan suasana hati, lalu kata-kata terbuka di kartu berjahit putus-putus seperti badge di logo. */
/* Palet dari logo: kuning mentega, jingga mangga, hijau matcha, cokelat, merah tua. f = isi, i = warna teks di atas latar, o = teks di atas isi. */
:root {
  --bg: #161511;
  --bg2: #fff8dc;
  --card: #fffdf3;
  --fg: #3a2218;
  --muted: #7a5a47;
  --line: #ecd9a0;
  --shadow: rgba(58, 34, 24, 0.2);

  --f-default: #f5a623; --i-default: #9a5b00; --o-default: #2b170f;
  --f-senang: #f5a623; --i-senang: #9a5b00; --o-senang: #2b170f;
  --f-sedih: #7a4a30; --i-sedih: #6b3e26; --o-sedih: #ffffff;
  --f-galau: #8bc34a; --i-galau: #3f6b1b; --o-galau: #2b170f;
  --f-stress: #f26a2e; --i-stress: #b03f0c; --o-stress: #2b170f;
  --f-marah: #9b1b1e; --i-marah: #9b1b1e; --o-marah: #ffffff;

  color-scheme: light;
  --font-display: "Baloo 2", "Segoe UI Rounded", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Nunito", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
body {
  background-color: var(--bg);
  background-image:
    radial-gradient(60rem 30rem at 90% -8%, var(--bg2), transparent 70%),
    radial-gradient(40rem 26rem at -10% 105%, var(--bg2), transparent 70%);
  background-repeat: no-repeat;
  overflow-x: hidden;
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.55;
  padding-block: 20px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

.topbar { position: relative; z-index: 1; display: flex; align-items: center; margin-bottom: 20px; }
.logo {
  display: block;
  width: 72px;
  height: 72px;
  border-radius: 50%;
  object-fit: cover;
  box-shadow: 0 0 0 4px var(--card), 0 8px 18px var(--shadow);
}

/* Mutiara boba melayang di latar. */
.pearls { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
.pearl { position: absolute; border-radius: 50%; opacity: 0.6; animation: floaty 7s ease-in-out infinite; }
.pearl::after { content: ""; position: absolute; top: 18%; left: 22%; width: 26%; height: 26%; border-radius: 50%; background: rgba(255, 255, 255, 0.6); }
.pearl:nth-child(2n) { animation-duration: 9s; animation-delay: -3s; }
.pearl:nth-child(3n) { animation-duration: 8s; animation-delay: -5s; }
@keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-16px); } }

.app {
  --fill: var(--f-default);
  --ink: var(--i-default);
  --on: var(--o-default);
  --accent-soft: color-mix(in srgb, var(--fill) 16%, var(--card));
  position: relative;
  z-index: 1;
  max-width: 560px;
  margin-inline: auto;
  display: flex;
  flex-direction: column;
  gap: 28px;
}
.app[data-mood="senang"] { --fill: var(--f-senang); --ink: var(--i-senang); --on: var(--o-senang); }
.app[data-mood="sedih"] { --fill: var(--f-sedih); --ink: var(--i-sedih); --on: var(--o-sedih); }
.app[data-mood="galau"] { --fill: var(--f-galau); --ink: var(--i-galau); --on: var(--o-galau); }
.app[data-mood="stress"] { --fill: var(--f-stress); --ink: var(--i-stress); --on: var(--o-stress); }
.app[data-mood="marah"] { --fill: var(--f-marah); --ink: var(--i-marah); --on: var(--o-marah); }

.brand {
  display: inline-block;
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--on);
  background: var(--fill);
  border-radius: 999px;
  padding: 2px 14px;
  margin: 0 0 12px;
  transition: background-color .25s;
}
h1 {
  font-family: var(--font-display);
  font-size: clamp(34px, 10vw, 54px);
  line-height: 1.05;
  font-weight: 700;
  letter-spacing: -0.01em;
  margin: 0;
  text-wrap: balance;
  overflow-wrap: anywhere;
}
.nm {
  background: linear-gradient(transparent 58%, color-mix(in srgb, var(--fill) 75%, transparent) 58%);
  padding: 0 0.08em;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
}
.lead { color: var(--muted); margin: 10px 0 0; max-width: 46ch; }

.field { display: flex; flex-direction: column; gap: 8px; margin: 0; }
label, legend { font-size: 14px; font-weight: 700; padding: 0; }
.row { display: flex; gap: 10px; }
input[type="text"] {
  font: inherit;
  font-size: 18px;
  font-weight: 600;
  color: var(--fg);
  background: var(--card);
  border: 2px solid var(--line);
  border-radius: 14px;
  padding: 12px 16px;
  flex: 1;
  min-width: 0;
}
input[type="text"]::placeholder { color: var(--muted); opacity: 0.75; font-weight: 400; }
input[type="text"]:focus-visible { outline: 3px solid color-mix(in srgb, var(--fill) 55%, transparent); outline-offset: 1px; border-color: var(--fill); }
.err { color: var(--i-marah); font-size: 14px; font-weight: 600; margin: 0; }

.who {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  font-size: 15px;
  color: var(--muted);
  margin-top: -8px;
}
.who b { color: var(--fg); font-weight: 700; overflow-wrap: anywhere; }
.link {
  font: inherit;
  font-size: 14px;
  font-weight: 700;
  color: var(--ink);
  background: none;
  border: 0;
  padding: 4px 0;
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 3px;
}
.link:focus-visible { outline: 3px solid color-mix(in srgb, var(--fill) 60%, transparent); outline-offset: 2px; border-radius: 4px; }

fieldset { border: 0; margin: 0; padding: 0; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.moods { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 10px; }
.mood {
  font: inherit;
  color: var(--fg);
  background: color-mix(in srgb, var(--m) 22%, var(--card));
  border: 2px solid color-mix(in srgb, var(--m) 60%, transparent);
  box-shadow: 0 4px 0 color-mix(in srgb, var(--m) 50%, transparent);
  border-radius: 18px;
  padding: 14px 8px 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  min-width: 0;
  transition: background-color .15s, transform .15s, box-shadow .15s;
}
.mood .face { font-size: 38px; line-height: 1; }
.mood .name { font-family: var(--font-display); font-size: 17px; font-weight: 600; line-height: 1.1; }
.mood:hover { transform: translateY(-3px); }
.mood:active { transform: translateY(3px); box-shadow: 0 1px 0 color-mix(in srgb, var(--m) 50%, transparent); }
.mood:focus-visible { outline: 3px solid color-mix(in srgb, var(--m) 60%, transparent); outline-offset: 2px; }
.mood[aria-pressed="true"] { background: var(--m); border-color: var(--m); color: var(--mo); }
.mood[data-key="senang"] { --m: var(--f-senang); --mo: var(--o-senang); }
.mood[data-key="sedih"] { --m: var(--f-sedih); --mo: var(--o-sedih); }
.mood[data-key="galau"] { --m: var(--f-galau); --mo: var(--o-galau); }
.mood[data-key="stress"] { --m: var(--f-stress); --mo: var(--o-stress); }
.mood[data-key="marah"] { --m: var(--f-marah); --mo: var(--o-marah); }

/* Kartu hasil: tepi putus-putus seperti jahitan di badge logo. */
.result {
  position: relative;
  background: linear-gradient(160deg, color-mix(in srgb, var(--fill) 30%, var(--card)), var(--card) 85%);
  border: 2.5px dashed var(--fill);
  border-radius: 26px;
  box-shadow: 0 6px 0 color-mix(in srgb, var(--fill) 45%, transparent), 0 18px 30px -14px var(--shadow);
  padding: 26px 22px 22px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  transition: background-color .25s, border-color .25s;
}
.result::before {
  content: "\201C";
  position: absolute;
  top: 2px;
  right: 18px;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 110px;
  line-height: 1;
  color: var(--fill);
  opacity: 0.4;
  pointer-events: none;
}
.tag {
  align-self: flex-start;
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--on);
  background: var(--fill);
  border-radius: 999px;
  padding: 3px 14px;
}
blockquote {
  margin: 0;
  min-height: 3em;
  font-family: var(--font-display);
  font-weight: 500;
  font-size: clamp(22px, 5.8vw, 28px);
  line-height: 1.35;
  text-wrap: pretty;
  overflow-wrap: anywhere;
}
.dots { display: inline-flex; gap: 8px; padding-top: 14px; }
.dots i {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--fill);
  animation: pulse 1s ease-in-out infinite;
}
.dots i:nth-child(2) { animation-delay: .15s; }
.dots i:nth-child(3) { animation-delay: .3s; }
@keyframes pulse { 0%, 100% { opacity: .25; transform: scale(.8); } 50% { opacity: 1; transform: scale(1); } }
.reveal { animation: clearup 1s ease both; }
@keyframes clearup { from { opacity: 0; filter: blur(10px); transform: translateY(8px); } to { opacity: 1; filter: blur(0); transform: none; } }

.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.btn {
  font-family: var(--font-display);
  font-size: 17px;
  font-weight: 600;
  line-height: 1.2;
  border-radius: 14px;
  padding: 10px 20px;
  cursor: pointer;
  border: 2px solid var(--fill);
  white-space: nowrap;
  transition: transform .15s;
}
.btn:active { transform: translateY(3px); }
.btn.primary:active { box-shadow: 0 1px 0 color-mix(in srgb, var(--fill) 60%, #3a2218); }
.btn:focus-visible { outline: 3px solid color-mix(in srgb, var(--fill) 60%, transparent); outline-offset: 2px; }
.btn.primary { background: var(--fill); color: var(--on); box-shadow: 0 4px 0 color-mix(in srgb, var(--fill) 60%, #3a2218); }
.btn.ghost { background: transparent; color: var(--fg); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--fill); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; box-shadow: none; }
.btn:disabled:active { transform: none; }
.go { width: 100%; margin-top: 6px; font-size: 19px; padding: 12px 20px; }
.foot { color: var(--muted); font-size: 13px; margin: 0; }

.screen { display: flex; flex-direction: column; gap: 28px; }
#s-nama, #s-hasil { min-height: 55vh; justify-content: center; }
h1 label { font-size: inherit; font-weight: inherit; padding: 0; }
#s-hasil blockquote { font-size: clamp(24px, 6.4vw, 32px); }
h1:focus { outline: none; }
.fade { animation: rise .4s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  .fade, .reveal, .dots i, .pearl { animation: none; }
  * { transition: none !important; }
}
</style>

      "Ingat rasa ini baik-baik. Nanti di hari yang berat, kamu bisa kembali ke sini.",
      "Kamu sudah berjalan sejauh ini, {nama}. Wajar kalau hari ini terasa menyenangkan.",
      "Langit mungkin biasa saja, tapi di dalam dirimu lagi cerah. Itu cukup.",
      "Bagikan kebahagiaanmu hari ini, {nama}. Satu pesan hangat bisa mengubah hari orang lain.",
      "Senang itu tidak perlu alasan besar. Secangkir minuman dingin pun boleh jadi alasan."
    ]},
    sedih: { label: "Sedih", face: "😢", quotes: [
      "Boleh menangis, {nama}. Air mata bukan tanda lemah, itu tanda kamu peduli.",
      "Hari ini berat, dan itu tidak apa-apa. Kamu tidak harus kuat setiap saat.",
      "Perasaan ini nyata, tapi tidak akan tinggal selamanya. Biarkan ia lewat pelan-pelan.",
      "{nama}, kamu sudah melakukan yang terbaik dengan tenaga yang kamu punya.",
      "Minum air, tarik napas panjang, istirahat sebentar. Hal kecil juga merawat.",
      "Tidak semua luka harus cepat sembuh. Pelan-pelan juga sembuh, {nama}.",
      "Kalau belum ingin bercerita, tidak apa-apa. Cukup ingat bahwa kamu tidak sendirian.",
      "Malam yang gelap tetap berakhir. Pagi selalu datang, {nama}, termasuk untukmu.",
      "Peluk dirimu sendiri hari ini. Kamu sedang butuh itu.",
      "Sedihmu valid, {nama}. Tidak perlu membandingkannya dengan masalah orang lain."
    ]},
    galau: { label: "Galau", face: "😕", quotes: [
      "Bingung itu tanda kamu sedang berpikir serius, {nama}. Tidak perlu terburu-buru memutuskan.",
      "Kamu tidak harus punya jawaban malam ini. Tidur dulu, besok kepala lebih jernih.",
      "Tulis semua yang berputar di kepalamu, {nama}. Pikiran yang tertulis lebih mudah diurai.",
      "Tidak ada pilihan yang sempurna. Pilih yang paling bisa kamu pertanggungjawabkan.",
      "Galau sering muncul saat kita peduli pada banyak hal. Itu bukan kekurangan.",
      "Kalau ragu, kecilkan pertanyaannya. Apa satu langkah kecil yang bisa kamu ambil hari ini, {nama}?",
      "Jangan putuskan hal besar saat pikiran lagi ramai. Beri waktu satu malam.",
      "Hatimu mungkin belum sepakat dengan kepalamu, {nama}. Dengarkan keduanya pelan-pelan.",
      "Tidak apa-apa belum tahu mau ke mana. Banyak orang berjalan sambil mencari arah.",
      "Ceritakan ke orang yang kamu percaya. Kadang jawabannya muncul saat kita bicara."
    ]},
    stress: { label: "Stress", face: "😖", quotes: [
      "Tarik napas empat hitungan, tahan, lalu buang pelan. Ulangi tiga kali, {nama}.",
      "Tugas yang menumpuk dikerjakan satu per satu. Pilih yang paling kecil dulu.",
      "Kamu bukan mesin, {nama}. Istirahat sepuluh menit bukan buang waktu.",
      "Tidak semua hal harus selesai hari ini. Tulis daftar, lalu pilih tiga yang terpenting.",
      "Turunkan bahumu, kendurkan rahangmu. Banyak stres menumpuk di sana tanpa kita sadari.",
      "Jalan kaki sebentar atau minum air putih. Tubuh yang tenang membantu kepala ikut tenang.",
      "Kamu sudah melewati hari-hari berat sebelumnya, {nama}. Yang ini juga akan terlewati.",
      "Kamu boleh bilang tidak pada hal yang belum sanggup kamu ambil sekarang.",
      "Matikan notifikasi sebentar. Dunia bisa menunggu lima belas menit.",
      "Meminta bantuan itu tanda cerdas, bukan tanda gagal, {nama}."
    ]},
    marah: { label: "Marah", face: "😠", quotes: [
      "Tarik napas dulu, {nama}. Jawaban yang diberikan saat tenang hampir selalu lebih baik.",
      "Marahmu boleh ada. Yang perlu dijaga adalah apa yang kamu lakukan dengannya.",
      "Sebelum membalas pesan itu, tunggu dua puluh menit. Kamu akan berterima kasih pada dirimu nanti.",

      "Tulis semua kekesalanmu di catatan, lalu jangan kirim ke siapa pun. Lega, tanpa penyesalan.",
      "Marah sering menutupi rasa kecewa. Kalau mau, coba cari tahu apa yang kecewa di dalamnya.",
      "Minum air dingin, cuci muka, atur napas. Tubuhmu perlu sinyal bahwa kamu aman, {nama}.",

  var $ = function (id) { return document.getElementById(id); };
  var app = $("app"), form = $("formNama"), nameEl = $("nama"), errEl = $("err");
  var moodsEl = $("moods"), result = $("result"), quoteEl = $("quote"), judulMood = $("judulMood");
  var screens = { nama: $("s-nama"), mood: $("s-mood"), hasil: $("s-hasil") };
  var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var state = { name: "", mood: null, tpl: "", last: {}, busy: false, timer: null };

  function cleanName() {
    var n = nameEl.value.replace(/\s+/g, " ").trim();
    return n ? n.charAt(0).toUpperCase() + n.slice(1) : "";
  }

  function replay(el, cls) {
    cls = cls || "fade";
    el.classList.remove(cls);
    void el.offsetWidth;
    el.classList.add(cls);
  }

  Object.keys(MOODS).forEach(function (key) {
    var m = MOODS[key];
    var b = document.createElement("button");
    b.type = "button";
    b.className = "mood";
    b.dataset.key = key;
    b.setAttribute("aria-pressed", "false");
    b.innerHTML = '<span class="face" aria-hidden="true">' + m.face + '</span><span class="name">' + m.label + "</span>";
    b.addEventListener("click", function () { chooseMood(key); });
    moodsEl.appendChild(b);
  });

  function pick(key) {
    var q = MOODS[key].quotes, i;
    do { i = Math.floor(Math.random() * q.length); } while (q.length > 1 && i === state.last[key]);
    state.last[key] = i;
    return q[i];
  }

  // Pindah halaman: hanya satu halaman yang tampil.
  function show(name) {
    Object.keys(screens).forEach(function (k) { screens[k].hidden = k !== name; });
    replay(screens[name]);
    try { window.scrollTo(0, 0); } catch (e) {}
    var h = screens[name].querySelector("h1");
    if (h) { h.setAttribute("tabindex", "-1"); h.focus({ preventScroll: true }); }
  }

  // Judul halaman 2: nama diberi stabilo.
  function nameHeading() {
    judulMood.textContent = "";
    judulMood.appendChild(document.createTextNode("Hai "));
    var nm = document.createElement("span");
    nm.className = "nm";
    nm.textContent = state.name;
    judulMood.appendChild(nm);
    judulMood.appendChild(document.createTextNode(", hari ini kamu lagi gimana?"));
  }

  // Halaman 1 ke 2: nama dikirim.
  function toMoods() {
    var n = cleanName();
    if (!n) { errEl.hidden = false; nameEl.focus(); return; }
    errEl.hidden = true;
    state.name = n;
    nameHeading();
    show("mood");
  }

  // Halaman 2 ke 3: begitu suasana hati dipilih, langsung pindah.
  function chooseMood(key) {
    if (state.busy) return;
    state.busy = true;
    state.mood = key;
    state.tpl = pick(key);
    app.dataset.mood = key;
    Array.prototype.forEach.call(moodsEl.children, function (b) {
      b.setAttribute("aria-pressed", b.dataset.key === key ? "true" : "false");
    });
    setTimeout(function () { show("hasil"); reveal(); }, reduced ? 0 : 300);
  }

  function burst() {
    if (reduced || !result.animate) return;
    var cols = ["#f5a623", "#8bc34a", "#f26a2e", "#7a4a30", "#fdd878", "#9b1b1e"];
    for (var i = 0; i < 16; i++) {
      var dot = document.createElement("span");
      var size = 8 + Math.random() * 8;
      dot.style.cssText = "position:absolute;left:50%;top:45%;width:" + size + "px;height:" + size + "px;border-radius:50%;pointer-events:none;background:" + cols[i % cols.length];
      result.appendChild(dot);
      var ang = Math.random() * Math.PI * 2, dist = 80 + Math.random() * 100;
      var anim = dot.animate([
        { transform: "translate(-50%,-50%) scale(.3)", opacity: 1 },
        { transform: "translate(calc(-50% + " + (Math.cos(ang) * dist) + "px), calc(-50% + " + (Math.sin(ang) * dist) + "px)) scale(1)", opacity: 0 }
      ], { duration: 800 + Math.random() * 300, easing: "cubic-bezier(.2,.8,.3,1)" });
      anim.onfinish = (function (el) { return function () { el.remove(); }; })(dot);
    }
  }

  // Halaman 3: tiga titik berdenyut sebentar, lalu kata-kata terbuka.
  function reveal() {
    quoteEl.className = "";
    quoteEl.innerHTML = '<span class="dots" role="img" aria-label="Sedang dibuka"><i></i><i></i><i></i></span>';
    replay(result);
    clearTimeout(state.timer);
    state.timer = setTimeout(function () {
      quoteEl.textContent = state.tpl.split("{nama}").join(state.name);
      replay(quoteEl, "reveal");
      burst();
    }, reduced ? 250 : 1600);
  }

  form.addEventListener("submit", function (e) { e.preventDefault(); toMoods(); });
  nameEl.addEventListener("input", function () { if (cleanName()) errEl.hidden = true; });
})();
</script>
